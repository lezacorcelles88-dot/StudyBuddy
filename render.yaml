services:
  - type: web
    name: studybuddy
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --workers=2 --bind=0.0.0.0:$PORT --timeout=120"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false   # Set manually in Render dashboard
      - key: DATABASE_URL
        sync: false   # Set manually or use Render's Postgres add-on
    disk:
      name: studybuddy-uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1
